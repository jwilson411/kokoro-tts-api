version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-deps:
        patterns:
          - "*"
    ignore:
      - dependency-name: "kokoro"
        versions: [">=0.8"]
      - dependency-name: "misaki"
        versions: [">=0.8"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
